; Dedicated PHP-FPM pool for Elysium Hospitality, isolated from the other sites on this server.
; Installed by deploy/server-setup.sh.
[elysium]
user = elysium
group = elysium
listen = /run/php/php8.3-fpm-elysium.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 60s
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[post_max_size] = 1M
php_admin_flag[expose_php] = off

; PHP can only open files in the app folder and the temp folder, not other sites' files.
php_admin_value[open_basedir] = /var/www/elysium/:/tmp/
; Remove a function from this list only if the app really needs it (e.g. proc_open for
; Symfony Process, popen/proc_open for mail sent through sendmail).
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec

; Deploys run without sudo, so OPcache must notice changed files on its own.
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
